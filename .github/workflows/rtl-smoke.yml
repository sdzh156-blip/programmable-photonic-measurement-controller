name: rtl-smoke

on:
  push:
  pull_request:

jobs:
  iverilog-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Static checks
        run: make static
      - name: Compile and run smoke test
        run: make smoke_iverilog
